name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only pushes carry no app code — skip the build. Release commits always
    # change build.gradle.kts (a non-ignored path), so version tags still build.
    # pull_request stays unfiltered so the required Build APK check still runs on
    # docs PRs (skipping a required check there would strand the PR).
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  # Manual "test APK" builds (#1848 D5): dispatched on main, a release-variant,
  # sideload-signed phone APK uploaded as a 1-day Actions artifact, never a
  # GitHub release (the release steps are push-only). It
  # installs over an existing sideload install, so a device round trip can test
  # sync config (CI secrets) without a tag while a RELEASE HOLD is on.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # event_name keeps a manual dispatch on main from cancelling main's push CI (and vice versa).
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs every module's JVM unit tests (plain JUnit + Robolectric). This job
  # used to only COMPILE them, so a test that failed on main went unnoticed
  # (DeadlineDateExtractorTest, found 2026-09-27). Running them compiles them,
  # so this replaces the old compile-only job. JDK 21: the Robolectric SDK-36
  # sandboxes refuse to start on 17; modules still emit Java 17 bytecode.
  # --continue reports every failing module in one run, not just the first.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize local.properties
        run: |
          set -euo pipefail
          # GitHub-hosted runner: the Android SDK ships preinstalled at $ANDROID_HOME.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > ./local.properties
      - name: candela-push tests (Python, stdlib only)
        # tools/candela-push writes the Push to Candela inbox row; its tests
        # pin the owner stamp and the attrs the Instant perms require.
        run: python3 tools/test_candela_push.py
      - name: play-upload tests (Python, stdlib only)
        # tools/play-upload sends the release AAB to Play's closed-testing track (#1456).
        run: python3 tools/test_play_upload.py
      - name: Run JVM unit tests
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew testDebugUnitTest --continue --no-daemon --stacktrace
      # GitHub shows at most 10 annotations per step, so the first real run
      # surfaced 10 of 304 failures. The step summary gets the full list.
      - name: List failing tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, html, os, re
          rows = []
          for f in sorted(glob.glob("**/build/test-results/testDebugUnitTest/*.xml", recursive=True)):
              module = f.split("/")[0]
              s = open(f, errors="ignore").read()
              for m in re.finditer(r'<testcase name="([^"]*)" classname="([^"]*)"[^>]*>\s*<(failure|error)(?: message="([^"]*)")?', s):
                  name, cls = html.unescape(m[1]), m[2]
                  lines = html.unescape(m[4] or "").splitlines()
                  msg = lines[0][:200] if lines else m[3]
                  rows.append((module, cls.split(".")[-1], name, msg))
                  print(f"::error title=Unit test failed::{cls} > {name}")
          cell = lambda t: t.replace("|", "\\|").replace("`", "'")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"## {len(rows)} failing unit test(s)\n\n")
              out.write("| Module | Class | Test | Message |\n|---|---|---|---|\n")
              for r in rows:
                  out.write("| " + " | ".join(cell(c) for c in r) + " |\n")
          print(f"{len(rows)} failing test(s); full list in the step summary")
          EOF
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'
          retention-days: 7

  # #1582 — EN↔ES parity gate. Fails a PR that adds a string to
  # values/strings.xml (in :app or :feature) without a values-es counterpart.
  # The existing gap (#1583) is grandfathered in each module's
  # lint-baseline.xml, so this is green today and only NEW drift reddens it.
  # PR-only: never on the tag/release path. Runs just the MissingTranslation
  # check (-Pcandela.lint.translationsOnly) so lint's unrelated backlog
  # can't fail it. Fix a failure by adding the ES string, or by marking the
  # string translatable="false" if it must never be translated.
  translation-parity:
    name: Translation parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize local.properties
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > ./local.properties
      - name: Lint — MissingTranslation only, against the baseline
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew :app:lintDebug :feature:lintDebug -Pcandela.lint.translationsOnly=true --no-daemon --stacktrace
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: translation-lint-reports
          path: |
            app/build/reports/lint-results-debug.*
            feature/build/reports/lint-results-debug.*

  build:
    # Job key + name kept verbatim ("build" / "Build APK") so the
    # workflow's required-status-check context on `main` flips to a
    # debug-free label as part of this PR. The branch-protection rule
    # is updated to require "Build APK" at merge time — see PR body.
    name: Build APK
    # Self-hosted runner on katana (jp-desktop). Switched off
    # ubuntu-latest 2026-05-12 after the jphein account hit its 3,000
    # Actions-min/mo cap. The desktop has JDK 17, Android SDK 34/35,
    # build-tools, adb, and a persistent ~/.gradle cache between runs
    # — so this is both free and faster than a cold hosted runner.
    # When/if we move back to hosted, swap `runs-on` for
    # `ubuntu-latest` and re-add the setup-java / setup-android /
    # actions/cache steps from git history.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # write required by softprops/action-gh-release on tag builds.
      # PR / main pushes don't reach that step, but the permission is
      # declared at job scope to keep `if:` step gating simple.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # #1830 — the in-app Handbook is compiled from docs/ into committed assets.
      # Fail fast (before the ~20 min build) when a chapter's doc or title changed
      # without regenerating them. No Gradle and no secrets; the manifest's
      # version stamp is ignored so a release bump alone stays green.
      - name: Handbook assets are current
        run: python3 scripts/build-handbook-assets.py --check

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize local.properties
        env:
          INSTANTDB_APP_ID: ${{ secrets.INSTANTDB_APP_ID }}
          INSTANTDB_API_URI: ${{ secrets.INSTANTDB_API_URI }}
          NOTION_OAUTH_CLIENT_ID: ${{ secrets.NOTION_OAUTH_CLIENT_ID }}
          NOTION_OAUTH_CLIENT_SECRET: ${{ secrets.NOTION_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TWO11_API_KEY: ${{ secrets.TWO11_API_KEY }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          # GitHub-hosted runner: nothing is seeded from a developer machine any more.
          # Everything the build needs beyond the checkout comes from Actions secrets.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > ./local.properties
          if [ -n "${INSTANTDB_APP_ID:-}" ]; then
            echo "INSTANTDB_APP_ID=$INSTANTDB_APP_ID" >> ./local.properties
          fi
          # Optional: INSTANTDB_API_URI points sync at a self-hosted Instant
          # (unset = Instant Cloud). BYO OAuth client ids (Notion, Google Drive
          # + its Picker key/project number, #1677) and the 211 NDP key (Local
          # Help, #1465) are baked into BuildConfig when the secrets exist; the
          # features stay hidden / "not configured" otherwise.
          # `if … fi`, not `[ -n ] && echo`: the latter returns 1 for an empty
          # last key and fails the step under set -e (#1822 review).
          for k in INSTANTDB_API_URI NOTION_OAUTH_CLIENT_ID NOTION_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET TWO11_API_KEY GOOGLE_PICKER_API_KEY GOOGLE_CLOUD_PROJECT_NUMBER; do
            v="${!k:-}"
            if [ -n "$v" ]; then echo "$k=$v" >> ./local.properties; fi
          done
          # No Play upload key in this job on purpose: it builds only the two sideload
          # APKs (debug-signed for upgrade continuity, #952). The Play AAB is built and
          # signed only in the `play-upload` job below (tag-only environment), and it is
          # never a GitHub release asset (an AAB is not installable by anyone; only
          # Play consumes it). See docs/release-keystore.md.
          if echo "${GITHUB_REF:-}" | grep -q '^refs/tags/v'; then
            if [ -z "${INSTANTDB_APP_ID:-}" ]; then
              echo "::warning::INSTANTDB_APP_ID secret is unset — this release APK will ship with cloud sync DISABLED. Set the INSTANTDB_APP_ID Actions secret."
            elif [ "$INSTANTDB_APP_ID" != "PLACEHOLDER" ] && \
               ! printf '%s' "$INSTANTDB_APP_ID" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
              echo "::error::INSTANTDB_APP_ID secret is not a valid UUID. A malformed app-id ships broken Cloud Sync that surfaces as a false 'email doesn't look right' error (#1452). Fix the Actions secret — no quotes or whitespace."
              exit 1
            fi
          fi
      - name: Assemble release APK
        # Issue #529 — was `:app:assembleDebug` through v0.5.57. Flipped
        # to `:app:assembleRelease` so the shipped artifact carries
        # `BuildConfig.DEBUG = false`, R8 minification stays on, and
        # the on-reader debug overlay can never reach end users. See
        # `app/build.gradle.kts` for the build-type rewrite that
        # backs this change. The signing config still points at the
        # checked-in debug keystore (no signature change for users —
        # existing sideload installs upgrade in place).
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Assemble Wear release APK
        # Companion watch app ("Library Nocturne"). Signed with the same
        # checked-in keystore as :app (see wear/build.gradle.kts) so the
        # two installs share a key — required for the Wearable Data Layer
        # phone <-> watch bridge. Unconditional like the phone build above,
        # so wear breakage is caught as a PR-time compile gate.
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew :wear:assembleRelease --no-daemon --stacktrace

      - name: Re-sign sideload APKs with rotated key (#1756)
        # APK Signature Scheme v3 key rotation. Both APKs (phone + Wear) are
        # re-signed with the checked-in debug key (v2 block, API 26–27) AND the
        # private candela-sideload key (v3 block + app/candela.lineage, API 28+),
        # so existing installs upgrade in place with no data loss and the two
        # apps keep one signing identity for the Data Layer bridge.
        #
        # PRs without the secrets (forks, Dependabot) skip this and keep the
        # debug-only signature — the gradle build is still the compile gate.
        # Tag builds REQUIRE the secrets: the lineage grants the old key no
        # rollback capability, so once users hold a rotated APK an unrotated
        # release would refuse to install over it.
        env:
          KS_B64: ${{ secrets.CANDELA_SIDELOAD_KEYSTORE_B64 }}
          CANDELA_SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.CANDELA_SIDELOAD_KEYSTORE_PASSWORD }}
          CANDELA_SIDELOAD_KEY_ALIAS: ${{ secrets.CANDELA_SIDELOAD_KEY_ALIAS }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          BUILD_TOOLS: 37.0.0
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ] || [ -z "${CANDELA_SIDELOAD_KEYSTORE_PASSWORD:-}" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::CANDELA_SIDELOAD_KEYSTORE_B64 / _PASSWORD secrets are missing on a tag build. Refusing to publish unrotated sideload APKs (#1756)."
              exit 1
            fi
            echo "::notice::Sideload signing secrets unavailable (fork or Dependabot PR) — skipping v3 re-sign; APKs keep the checked-in debug signature."
            exit 0
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/build-tools/$BUILD_TOOLS/apksigner" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" < /dev/null > /dev/null
          fi
          export APKSIGNER="$SDK/build-tools/$BUILD_TOOLS/apksigner"
          export CANDELA_SIDELOAD_KEYSTORE="$RUNNER_TEMP/candela-sideload.keystore"
          trap 'rm -f "$CANDELA_SIDELOAD_KEYSTORE"' EXIT
          ( umask 077; printf '%s' "$KS_B64" | base64 -d > "$CANDELA_SIDELOAD_KEYSTORE" )
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk wear/build/outputs/apk/release/*.apk)
          [ "${#APKS[@]}" -ge 2 ] || { echo "::error::expected phone + wear APKs, found: ${APKS[*]:-none}"; exit 1; }
          ./scripts/resign-sideload.sh "${APKS[@]}"

      - name: Cold-launch perf guard (Issue #618)
        # Reads the StartupBenchmark JSON (if present) and fails the
        # build when the cold-launch median exceeds the threshold
        # pinned in baselineprofile/.../ColdLaunchThresholds.kt
        # (tablet 1500 ms, phone 500 ms). Skips quietly when no
        # benchmark output exists — PR runs do not attach a device,
        # so the guard is a no-op there. On tag builds with a
        # connected device the previous step's macrobench leaves a
        # JSON report under the conventional location.
        #
        # The guard ALWAYS runs (even on PR) so the script's
        # threshold-file integrity check + threshold parsing is
        # exercised on every CI run — a regression that breaks the
        # parser is caught at PR time even though the threshold check
        # itself is skipped without a device.
        run: ./scripts/check-cold-launch.sh

      - name: Upload test APK (manual dispatch only)
        # #1848: the installable phone APK from a workflow_dispatch run on main
        # (reviewed code only), for a pre-release device check. Delete it once
        # the devices have it. Artifacts on this public repo can be
        # downloaded by any signed-in GitHub user, so keep it short-lived; it
        # is the same app main would ship, not a release.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: candela-test-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Rename release artifacts with tag
        # Only runs on tag builds — for PR / main pushes we just
        # verify the build compiles and stop. The local-build path
        # in `app/build.gradle.kts` (applicationVariants.all) already
        # renames `app-release.apk` -> `candela-v<versionName>.apk`
        # at AGP-output time. We still re-cp here using the tag name
        # so the published asset uses the GIT TAG (which may diverge
        # from versionName in pathological cases — historical sanity
        # check from v0.4.x tagging mishaps).
        # push only: a workflow_dispatch on a tag ref must never publish (#1851 review).
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          OUT_DIR=app/build/outputs/apk/release
          # Prefer the AGP-renamed file; fall back to app-release.apk
          # if the variant rename ever stops firing.
          SRC=$(ls "$OUT_DIR"/candela-v*.apk 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            SRC="$OUT_DIR/app-release.apk"
          fi
          DST="$OUT_DIR/candela-${TAG}.apk"
          # `cp file file` errors with exit 1 — happens when AGP's
          # applicationVariants rename already produced the
          # tag-named file. Skip the copy in that case.
          if [ "$SRC" != "$DST" ]; then
            cp "$SRC" "$DST"
          fi
          # Wear companion: :wear has no applicationVariants rename, so
          # its output is always wear-release.apk. Copy to the tag name.
          WEAR_DIR=wear/build/outputs/apk/release
          cp "$WEAR_DIR/wear-release.apk" "$WEAR_DIR/candela-wear-${TAG}.apk"
      - name: Create GitHub release
        # Used to be a separate `release:` job that pulled the APK
        # via actions/download-artifact. Collapsed into the build
        # job 2026-05-12 because the GitHub Actions artifact-storage
        # quota also hit zero (separate from the minutes cap) — so
        # upload-artifact + download-artifact would fail. GitHub
        # *releases* use a different storage quota that isn't capped,
        # so attaching directly via softprops/action-gh-release stays
        # within budget. Since both halves now share a GitHub-hosted
        # runner, the APK is just on disk; no transfer needed.
        # push only: a workflow_dispatch on a tag ref must never publish (#1851 review).
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Release build for `${{ github.ref_name }}`.

            - `candela-${{ github.ref_name }}.apk` — phone / tablet (sideload)
            - `candela-wear-${{ github.ref_name }}.apk` — Wear OS companion ("Library Nocturne"), sideload to the watch

            > Both APKs share one signing identity so the watch ↔ phone Data Layer bridge pairs — sideload distribution. They carry APK Signature Scheme v3 key rotation (#1756): the original checked-in key (v2, Android 8.x) plus a private TechEMPOWER sideload key (v3 + lineage, Android 9+), so existing installs upgrade in place with no data loss. There is no AAB here: it is not installable by anyone. The Play bundle goes straight to Play's closed testing as a draft (docs/release-keystore.md, #1456).
          files: |
            app/build/outputs/apk/release/candela-${{ github.ref_name }}.apk
            wear/build/outputs/apk/release/candela-wear-${{ github.ref_name }}.apk

  play-upload:
    # #1456 — every v* tag uploads its AAB, signed with the Play UPLOAD key, to the
    # closed-testing track "alpha" as a DRAFT release, so a human still clicks Roll
    # out in Play Console. JP approved the upload key in CI on 2026-10-23 (ask
    # candela:play-upload-key-in-ci). The PLAY_* secrets live ONLY in the
    # `play-upload` environment, which only refs/tags/v* may deploy to (a ref gate:
    # no other job may name it; SecretScopeTest enforces that), and a tag ruleset
    # lets only repo admins create v* tags. Until all four exist the job logs
    # a notice and passes. Rotation: docs/release-keystore.md "Rotating the upload key".
    # Separate job + separate gradle invocation from assembleRelease (#952).
    name: Play upload (draft)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    environment: play-upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HAS_PLAY_SECRETS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 != '' && secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD != '' && secrets.PLAY_UPLOAD_KEY_PASSWORD != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # The Play upload certificate (docs/release-keystore.md). A bundle signed with anything else is refused here.
      UPLOAD_CERT_SHA256: "38:9F:BD:AA:4A:11:48:3B:57:8A:0C:85:A4:3A:47:05:FF:31:E9:BD:7B:A7:4C:EC:F2:47:F5:3E:AC:85:E0:16"
      NDK: 29.0.14206865
    steps:
      - name: Skip (Play secrets not set)
        if: env.HAS_PLAY_SECRETS != 'true'
        run: echo "::notice::PLAY_* secrets are not set, so no Play upload. The AAB stays a manual step (docs/release-keystore.md)."

      - name: Checkout
        if: env.HAS_PLAY_SECRETS == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Set up JDK 21
        if: env.HAS_PLAY_SECRETS == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        if: env.HAS_PLAY_SECRETS == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          cache-read-only: true  # this job holds signing secrets: it never writes a cache (#1862 Oracle)

      - name: Install the pinned NDK (#1691 debug symbols), before any secret is in the environment
        if: env.HAS_PLAY_SECRETS == 'true'
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK/ndk/$NDK" ] || "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" < /dev/null > /dev/null

      - name: Materialize local.properties (upload key + the same BuildConfig keys as the sideload build)
        if: env.HAS_PLAY_SECRETS == 'true'
        env:
          KS_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          INSTANTDB_APP_ID: ${{ secrets.INSTANTDB_APP_ID }}
          INSTANTDB_API_URI: ${{ secrets.INSTANTDB_API_URI }}
          NOTION_OAUTH_CLIENT_ID: ${{ secrets.NOTION_OAUTH_CLIENT_ID }}
          NOTION_OAUTH_CLIENT_SECRET: ${{ secrets.NOTION_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TWO11_API_KEY: ${{ secrets.TWO11_API_KEY }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          rm -f ./local.properties  # umask only protects new files, so never truncate an existing one
          ( umask 077; printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"; : > ./local.properties )
          {
            printf 'sdk.dir=%s\n' "$SDK"
            printf 'storyvox.releaseStoreFile=%s\n' "$RUNNER_TEMP/upload.keystore"
            printf 'storyvox.releaseStorePassword=%s\n' "$KS_PASS"
            printf 'storyvox.releaseKeyAlias=storyvox\n'
            printf 'storyvox.releaseKeyPassword=%s\n' "$KEY_PASS"
            for k in INSTANTDB_APP_ID INSTANTDB_API_URI NOTION_OAUTH_CLIENT_ID NOTION_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET TWO11_API_KEY GOOGLE_PICKER_API_KEY GOOGLE_CLOUD_PROJECT_NUMBER; do
              v="${!k:-}"
              if [ -n "$v" ]; then echo "$k=$v"; fi
            done
          } >> ./local.properties

      - name: Build the signed AAB
        if: env.HAS_PLAY_SECRETS == 'true'
        # --no-configuration-cache: the cache entry would hold the signing passwords in the workspace (#1862 Oracle).
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew :app:bundleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Refuse a bundle not signed with the upload key
        if: env.HAS_PLAY_SECRETS == 'true'
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          got=$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/{print $2; exit}')
          if [ "$got" != "$UPLOAD_CERT_SHA256" ]; then
            echo "::error::AAB signer $got is not the Play upload key $UPLOAD_CERT_SHA256"
            exit 1
          fi
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: Upload to Play (closed testing "alpha", draft)
        if: env.HAS_PLAY_SECRETS == 'true'
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          ( umask 077; printf '%s' "$SA_JSON" > "$RUNNER_TEMP/play-sa.json" )
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          NAME=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$NAME" != "$VERSION" ]; then echo "::error::tag $GITHUB_REF_NAME but versionName is $NAME"; exit 1; fi
          python3 tools/play-upload --aab "$AAB" --version-name "$VERSION" --version-code "$CODE" \
            --credentials-file "$RUNNER_TEMP/play-sa.json" --notes-from CHANGELOG.md \
            --track alpha --status draft --commit

      - name: Remove key material
        if: always() && env.HAS_PLAY_SECRETS == 'true'
        run: rm -rf "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/play-sa.json" ./local.properties ./.gradle/configuration-cache
