name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only pushes carry no app code — skip the build. Release commits always
    # change build.gradle.kts (a non-ignored path), so version tags still build.
    # pull_request stays unfiltered so the required Build APK check still runs on
    # docs PRs (skipping a required check there would strand the PR).
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-compile:
    name: Test Compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize local.properties
        run: |
          set -euo pipefail
          # GitHub-hosted runner: the Android SDK ships preinstalled at $ANDROID_HOME.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > ./local.properties
      - name: Compile test sources
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew compileDebugUnitTestKotlin --no-daemon --stacktrace

  build:
    # Job key + name kept verbatim ("build" / "Build APK") so the
    # workflow's required-status-check context on `main` flips to a
    # debug-free label as part of this PR. The branch-protection rule
    # is updated to require "Build APK" at merge time — see PR body.
    name: Build APK
    # Self-hosted runner on katana (jp-desktop). Switched off
    # ubuntu-latest 2026-05-12 after the jphein account hit its 3,000
    # Actions-min/mo cap. The desktop has JDK 17, Android SDK 34/35,
    # build-tools, adb, and a persistent ~/.gradle cache between runs
    # — so this is both free and faster than a cold hosted runner.
    # When/if we move back to hosted, swap `runs-on` for
    # `ubuntu-latest` and re-add the setup-java / setup-android /
    # actions/cache steps from git history.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # write required by softprops/action-gh-release on tag builds.
      # PR / main pushes don't reach that step, but the permission is
      # declared at job scope to keep `if:` step gating simple.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize local.properties
        env:
          INSTANTDB_APP_ID: ${{ secrets.INSTANTDB_APP_ID }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # GitHub-hosted runner: nothing is seeded from a developer machine any more.
          # Everything the build needs beyond the checkout comes from Actions secrets.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > ./local.properties
          if [ -n "${INSTANTDB_APP_ID:-}" ]; then
            echo "INSTANTDB_APP_ID=$INSTANTDB_APP_ID" >> ./local.properties
          fi
          # Release keystore (release-signs the Play AAB; the sideload APKs keep the
          # checked-in debug keystore on purpose — see app/build.gradle.kts). Decoded
          # into RUNNER_TEMP, which is wiped with the job.
          if [ -n "${RELEASE_KEYSTORE_B64:-}" ]; then
            KS="$RUNNER_TEMP/storyvox-release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$KS"
            {
              echo "storyvox.releaseStoreFile=$KS"
              echo "storyvox.releaseStorePassword=$RELEASE_STORE_PASSWORD"
              echo "storyvox.releaseKeyAlias=$RELEASE_KEY_ALIAS"
              echo "storyvox.releaseKeyPassword=$RELEASE_KEY_PASSWORD"
            } >> ./local.properties
          fi
          if echo "${GITHUB_REF:-}" | grep -q '^refs/tags/v'; then
            if [ -z "${INSTANTDB_APP_ID:-}" ]; then
              echo "::warning::INSTANTDB_APP_ID secret is unset — this release APK will ship with cloud sync DISABLED. Set the INSTANTDB_APP_ID Actions secret."
            elif [ "$INSTANTDB_APP_ID" != "PLACEHOLDER" ] && \
               ! printf '%s' "$INSTANTDB_APP_ID" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
              echo "::error::INSTANTDB_APP_ID secret is not a valid UUID. A malformed app-id ships broken Cloud Sync that surfaces as a false 'email doesn't look right' error (#1452). Fix the Actions secret — no quotes or whitespace."
              exit 1
            fi
            if [ -z "${RELEASE_KEYSTORE_B64:-}" ]; then
              echo "::warning::RELEASE_KEYSTORE_B64 secret is unset — the AAB will be debug-signed and withheld from the release (#1476 guard)."
            fi
          fi
      - name: Assemble release APK
        # Issue #529 — was `:app:assembleDebug` through v0.5.57. Flipped
        # to `:app:assembleRelease` so the shipped artifact carries
        # `BuildConfig.DEBUG = false`, R8 minification stays on, and
        # the on-reader debug overlay can never reach end users. See
        # `app/build.gradle.kts` for the build-type rewrite that
        # backs this change. The signing config still points at the
        # checked-in debug keystore (no signature change for users —
        # existing sideload installs upgrade in place).
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Bundle release AAB (Play Store)
        # Issue #1456 — Android App Bundle for Play Store distribution.
        # Tag-only: the AAB is a release artifact; PR / main pushes stay
        # APK-only so PR CI stays fast (assembleRelease above is the compile
        # gate, and bundleRelease shares its compile graph — a bundle-only
        # break is near-impossible if the APK assembled).
        #
        # MUST stay a SEPARATE gradle invocation from assembleRelease above —
        # never `./gradlew :app:assembleRelease :app:bundleRelease`. The
        # signing split in app/build.gradle.kts (#952, isBundleOrPublishBuild)
        # release-signs any invocation whose task graph contains "bundle";
        # a combined call would release-sign the *APK* too and break sideload
        # upgrade continuity (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Separate
        # steps = separate task graphs → the APK stays debug-signed and the
        # AAB gets the Play release keystore (on a runner with the
        # storyvox.release* props; otherwise a harmless debug-signed AAB).
        if: startsWith(github.ref, 'refs/tags/v')
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Guard — reject debug-signed AAB (#1476)
        # The release AAB is only correctly signed on a runner that holds the
        # storyvox release keystore (katana today). On familiar / ubox0 it falls
        # back to the checked-in DEBUG keystore, and Play Console rejects
        # debug-signed bundles (#1476, hit for real on v1.7.0).
        #
        # Rather than sink the whole tag build — the debug-signed *sideload*
        # APK + Wear APK are perfectly good and must still ship — this guard:
        #   (a) reads the AAB's v1 (JAR) signer-cert CN with openssl (no keytool
        #       needed: unzip the META-INF/*.RSA block → pkcs7 → x509 subject);
        #   (b) if it's debug-signed (or the signer can't be verified), WITHHOLDS
        #       the bundle — removes it so the release step below can't attach it
        #       — and records AAB_DEBUG_SIGNED=true;
        #   (c) a later step fails the run so the signing gap is impossible to
        #       miss. The GitHub release is created first, so it is NOT torpedoed.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -u
          AAB_DIR=app/build/outputs/bundle/release
          AAB="$AAB_DIR/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error::#1476 guard: expected the release bundle at $AAB but none was produced."
            echo "AAB_DEBUG_SIGNED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # AABs are jarsigner-signed (v1): the signer block is META-INF/*.RSA
          # (or *.EC / *.DSA). Stream it through openssl to read the cert subject.
          SIG_ENTRY=$(unzip -Z1 "$AAB" 2>/dev/null | grep -iE '^META-INF/.*\.(RSA|EC|DSA)$' | head -1)
          SUBJECT=""
          if [ -n "$SIG_ENTRY" ]; then
            SUBJECT=$(unzip -p "$AAB" "$SIG_ENTRY" \
              | openssl pkcs7 -inform DER -print_certs 2>/dev/null \
              | openssl x509 -noout -subject 2>/dev/null || true)
          fi
          echo "AAB signer subject: ${SUBJECT:-<none found>}"
          if [ -z "$SUBJECT" ] || echo "$SUBJECT" | grep -qi 'debug'; then
            echo "::error::#1476 — the tag-built AAB is debug-signed (${SUBJECT:-no signer found}); Play Console rejects debug-signed bundles, so it has NOT been attached to this release. Check the RELEASE_KEYSTORE_B64 / RELEASE_* Actions secrets and re-run the tag build, or build the bundle locally with the release keystore (./gradlew :app:bundleRelease — a SEPARATE invocation, per #952) and upload candela-${GITHUB_REF_NAME}.aab to the Play Console manually. The sideload APK + Wear APK in this release are unaffected."
            rm -f "$AAB" "$AAB_DIR"/candela-*.aab
            echo "AAB_DEBUG_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::#1476 — AAB is release-signed ($SUBJECT); attaching it to the release."
            echo "AAB_DEBUG_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Assemble Wear release APK
        # Companion watch app ("Library Nocturne"). Signed with the same
        # checked-in keystore as :app (see wear/build.gradle.kts) so the
        # two installs share a key — required for the Wearable Data Layer
        # phone <-> watch bridge. Unconditional like the phone build above,
        # so wear breakage is caught as a PR-time compile gate.
        run: PATH="$JAVA_HOME/bin:$PATH" ./gradlew :wear:assembleRelease --no-daemon --stacktrace

      - name: Cold-launch perf guard (Issue #618)
        # Reads the StartupBenchmark JSON (if present) and fails the
        # build when the cold-launch median exceeds the threshold
        # pinned in baselineprofile/.../ColdLaunchThresholds.kt
        # (tablet 1500 ms, phone 500 ms). Skips quietly when no
        # benchmark output exists — PR runs do not attach a device,
        # so the guard is a no-op there. On tag builds with a
        # connected device the previous step's macrobench leaves a
        # JSON report under the conventional location.
        #
        # The guard ALWAYS runs (even on PR) so the script's
        # threshold-file integrity check + threshold parsing is
        # exercised on every CI run — a regression that breaks the
        # parser is caught at PR time even though the threshold check
        # itself is skipped without a device.
        run: ./scripts/check-cold-launch.sh

      - name: Rename release artifacts with tag
        # Only runs on tag builds — for PR / main pushes we just
        # verify the build compiles and stop. The local-build path
        # in `app/build.gradle.kts` (applicationVariants.all) already
        # renames `app-release.apk` -> `candela-v<versionName>.apk`
        # at AGP-output time. We still re-cp here using the tag name
        # so the published asset uses the GIT TAG (which may diverge
        # from versionName in pathological cases — historical sanity
        # check from v0.4.x tagging mishaps).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          OUT_DIR=app/build/outputs/apk/release
          # Prefer the AGP-renamed file; fall back to app-release.apk
          # if the variant rename ever stops firing.
          SRC=$(ls "$OUT_DIR"/candela-v*.apk 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            SRC="$OUT_DIR/app-release.apk"
          fi
          DST="$OUT_DIR/candela-${TAG}.apk"
          # `cp file file` errors with exit 1 — happens when AGP's
          # applicationVariants rename already produced the
          # tag-named file. Skip the copy in that case.
          if [ "$SRC" != "$DST" ]; then
            cp "$SRC" "$DST"
          fi
          # Wear companion: :wear has no applicationVariants rename, so
          # its output is always wear-release.apk. Copy to the tag name.
          WEAR_DIR=wear/build/outputs/apk/release
          cp "$WEAR_DIR/wear-release.apk" "$WEAR_DIR/candela-wear-${TAG}.apk"
          # AAB (#1456): the applicationVariants rename fires for APK outputs
          # only, so the bundle output stays app-release.aab. Copy it to the
          # git-tag name for the Play Store upload asset (prefer a branded
          # name if a bundle rename ever starts firing, else app-release.aab).
          AAB_DIR=app/build/outputs/bundle/release
          AAB_SRC=$(ls "$AAB_DIR"/candela-v*.aab 2>/dev/null | head -1)
          if [ -z "$AAB_SRC" ]; then
            AAB_SRC="$AAB_DIR/app-release.aab"
          fi
          AAB_DST="$AAB_DIR/candela-${TAG}.aab"
          # #1476 — the debug-signed-AAB guard above removes the bundle when it
          # fails the signing check, so the source may be absent here. Only
          # rename a bundle that still exists; a withheld AAB is simply not
          # attached (softprops fail_on_unmatched_files defaults to false, so the
          # missing glob is skipped rather than failing the release step).
          if [ -f "$AAB_SRC" ] && [ "$AAB_SRC" != "$AAB_DST" ]; then
            cp "$AAB_SRC" "$AAB_DST"
          fi

      - name: Create GitHub release
        # Used to be a separate `release:` job that pulled the APK
        # via actions/download-artifact. Collapsed into the build
        # job 2026-05-12 because the GitHub Actions artifact-storage
        # quota also hit zero (separate from the minutes cap) — so
        # upload-artifact + download-artifact would fail. GitHub
        # *releases* use a different storage quota that isn't capped,
        # so attaching directly via softprops/action-gh-release stays
        # within budget. Since both halves now share a GitHub-hosted
        # runner, the APK is just on disk; no transfer needed.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Release build for `${{ github.ref_name }}`.

            - `candela-${{ github.ref_name }}.apk` — phone / tablet (sideload)
            - `candela-wear-${{ github.ref_name }}.apk` — Wear OS companion ("Library Nocturne"), sideload to the watch
            - `candela-${{ github.ref_name }}.aab` — Android App Bundle for Play Store upload (#1456)

            > The two APKs are signed with the project's checked-in keystore (stable since v0.4.15) so the watch ↔ phone Data Layer bridge pairs — sideload-only distribution today. The `.aab` is release-signed for Play upload with the keystore held in Actions secrets (a debug-signed bundle is withheld by the #1476 guard). Upload to Play Console is still manual until #1456's GPP credentials land.
          files: |
            app/build/outputs/apk/release/candela-${{ github.ref_name }}.apk
            wear/build/outputs/apk/release/candela-wear-${{ github.ref_name }}.apk
            app/build/outputs/bundle/release/candela-${{ github.ref_name }}.aab

      - name: Fail the tag build if the AAB was withheld (#1476)
        # Runs AFTER "Create GitHub release", so the sideload APK + Wear APK are
        # already published — this never torpedoes the APK release. Its only job
        # is to turn the run RED when the guard withheld a debug-signed bundle,
        # so the signing gap is impossible to miss and someone produces the AAB
        # on katana + uploads it to Play. Uses the runner-provided
        # $GITHUB_REF_NAME shell var (not ${{ }} interpolation) to keep run: free
        # of injected expressions.
        if: startsWith(github.ref, 'refs/tags/v') && env.AAB_DEBUG_SIGNED == 'true'
        run: |
          echo "::error::#1476 — release ${GITHUB_REF_NAME} was published WITHOUT a Play AAB: the CI-built bundle was debug-signed (RELEASE_KEYSTORE_B64 / RELEASE_* secrets missing or wrong). Fix the secrets and re-run, or build ./gradlew :app:bundleRelease locally with the release keystore (separate invocation, per #952) and upload candela-${GITHUB_REF_NAME}.aab to the Play Console. Tracking: #1476."
          exit 1
