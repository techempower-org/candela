name: VoxSherpa upstream watch

# Dependabot can track Maven/Gradle coordinates resolved through real
# repositories, but VoxSherpa-TTS is consumed via JitPack as a raw GitHub
# coordinate (com.github.techempower-org:VoxSherpa-TTS:vX.Y.Z). JitPack builds
# whatever git tag you name — there is no Maven metadata for dependabot to
# poll — so new VoxSherpa releases would otherwise slip past unnoticed.
#
# This job closes that gap: weekly (and on demand) it checks two things and
# opens a single `dependencies`-labelled issue when either fires:
#
#   1. Fork release — the newest semver tag on the published fork
#      (techempower-org/VoxSherpa-TTS, the JitPack coordinate) is ahead of the
#      pin in core-playback/build.gradle.kts → bump the pin.
#   2. Upstream engine changes — upstream (CodeBySonu95/VoxSherpa-TTS) has
#      commits after UPSTREAM_REVIEWED_SHA that touch the engine source files
#      the fork's engine-lib AAR re-exports → review them for a fork-side port.
#
# #1713: upstream's own tags (v3.0, v4.0, …) are APP releases in a version
# namespace unrelated to the fork's engine-lib semver, so comparing them to the
# pin was a perpetual false positive. Upstream is tracked by commit instead:
# after reviewing new upstream engine commits (porting what's wanted into the
# fork), advance UPSTREAM_REVIEWED_SHA to the reviewed upstream main sha.
#
# Idempotent: a stable marker line in the issue body is grepped across open
# issues before filing, so a stale "new version" issue is updated/skipped
# rather than duplicated week after week.

on:
  schedule:
    # Mondays 06:17 UTC — off the :00 mark so we don't pile onto the
    # top-of-hour cron crush, and early enough to land before the week's work.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Issue creation needs write; nothing else is touched.
permissions:
  contents: read
  issues: write

concurrency:
  group: voxsherpa-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check VoxSherpa-TTS upstream
    # Match the repo convention (android.yml / release-docs-sync.yml): the
    # GitHub-hosted; the repo is public so Actions minutes are free. This
    # job only needs git + gh + jq, all present on the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # The published fork (JitPack coordinate) and the upstream source.
      FORK_REPO: techempower-org/VoxSherpa-TTS
      UPSTREAM_REPO: CodeBySonu95/VoxSherpa-TTS
      # Upstream main as of the last fork-side review (#1713, 2026-09-27:
      # nativeLock UAF guard ported as fork v2.11.0/v2.11.1; the rest of v4.0 was
      # reviewed and deliberately not taken). Advance after each review.
      UPSTREAM_REVIEWED_SHA: 7f05a35762f033a39c3c8be0d3ff8db982737ea7
      # Upstream sources the fork's engine-lib re-exports (mirror of the
      # `java.includes` whitelist in the fork's engine-lib/build.gradle).
      # Upstream commits touching anything else (app UI, docs, site) are
      # irrelevant to Candela and never fire the watch.
      ENGINE_PATH_REGEX: '^app/src/main/java/com/CodeBySonu/VoxSherpa/(KokoroEngine|VoiceEngine|KittenEngine|SupertonicEngine|Sonic|AudioEmotionHelper|KokoroVoiceHelper|GenerationParams)\.java$|^app/build\.gradle$'
      # Stable marker embedded in the issue body so the idempotency search
      # matches our own issues and nothing else.
      MARKER: '<!-- voxsherpa-watch -->'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect new VoxSherpa-TTS versions and file an issue
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="core-playback/build.gradle.kts"

          # --- Pinned version --------------------------------------------------
          # Line looks like:
          #   implementation("com.github.techempower-org:VoxSherpa-TTS:v2.8.0")
          PINNED="$(grep -oE 'VoxSherpa-TTS:v[0-9]+\.[0-9]+(\.[0-9]+)?' "$BUILD_FILE" \
                    | head -n1 | sed 's/.*://')"
          if [ -z "${PINNED:-}" ]; then
            echo "::error::Could not find a pinned VoxSherpa-TTS:vX.Y.Z in $BUILD_FILE"
            exit 1
          fi
          echo "Pinned VoxSherpa-TTS version: $PINNED"

          # --- Helpers ---------------------------------------------------------
          # Newest semver-looking tag (vX.Y or vX.Y.Z) for a repo. Non-semver
          # tags (voices-v2, piper-en-fp32, …) are filtered out so they never
          # masquerade as a release. Empty string if the repo has no semver tag.
          latest_semver_tag() {
            local repo="$1"
            gh api --paginate "repos/${repo}/tags" --jq '.[].name' 2>/dev/null \
              | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -V \
              | tail -n1
          }

          # Returns 0 (true) if $1 is strictly greater than $2 as a version.
          version_gt() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          FORK_LATEST="$(latest_semver_tag "$FORK_REPO" || true)"
          echo "Fork ($FORK_REPO) latest semver tag: ${FORK_LATEST:-<none>}"

          # --- 1. Fork release ahead of the pin --------------------------------
          # Strip leading 'v' for sort -V; it copes with it either way but be
          # explicit so the comparison is unambiguous.
          PIN_NUM="${PINNED#v}"
          NEWER=()
          if [ -n "${FORK_LATEST:-}" ] && version_gt "${FORK_LATEST#v}" "$PIN_NUM"; then
            NEWER+=("$FORK_REPO -> $FORK_LATEST (JitPack coordinate; bump core-playback/build.gradle.kts)")
          fi

          # --- 2. Upstream engine commits since the last review ----------------
          # Upstream tags are NOT compared (see header, #1713). Compare the
          # reviewed sha to upstream main and keep only engine-source files.
          # gh api prints the error JSON to stdout on a 404, so gate on its
          # exit status, not on empty output.
          if ! COMPARE_JSON="$(gh api "repos/${UPSTREAM_REPO}/compare/${UPSTREAM_REVIEWED_SHA}...main" 2>/dev/null)"; then
            echo "::warning::Could not compare ${UPSTREAM_REPO} ${UPSTREAM_REVIEWED_SHA}...main (sha gone after a force-push?)"
            NEWER+=("$UPSTREAM_REPO: reviewed sha \`${UPSTREAM_REVIEWED_SHA:0:7}\` no longer comparable to main — re-review upstream and reset UPSTREAM_REVIEWED_SHA")
          else
            UP_AHEAD="$(jq -r '.ahead_by' <<<"$COMPARE_JSON")"
            ENGINE_FILES="$(jq -r '.files[]?.filename' <<<"$COMPARE_JSON" | grep -E "$ENGINE_PATH_REGEX" || true)"
            echo "Upstream commits since reviewed sha: $UP_AHEAD; engine files touched: ${ENGINE_FILES:-<none>}"
            if [ -n "$ENGINE_FILES" ]; then
              UP_HEAD="$(jq -r '.commits[-1].sha // empty' <<<"$COMPARE_JSON")"
              NEWER+=("$UPSTREAM_REPO: $UP_AHEAD commit(s) since \`${UPSTREAM_REVIEWED_SHA:0:7}\` touch engine sources ($(echo "$ENGINE_FILES" | sed 's#.*/##' | paste -sd, -)) — review for a fork-side port: https://github.com/${UPSTREAM_REPO}/compare/${UPSTREAM_REVIEWED_SHA}...${UP_HEAD:-main}")
            fi
          fi

          if [ "${#NEWER[@]}" -eq 0 ]; then
            echo "VoxSherpa-TTS is up to date at $PINNED — nothing to file."
            exit 0
          fi

          # --- Idempotency: skip if an open issue already carries our marker --
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                        --search "in:body ${MARKER}" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "${EXISTING:-}" ] && [ "$EXISTING" != "null" ]; then
            echo "Open VoxSherpa-watch issue #$EXISTING already exists — leaving a refresh comment instead of duplicating."
            {
              echo "Re-checked on $(date -u '+%Y-%m-%d %H:%M UTC'). Pinned: \`$PINNED\`. Still outstanding:"
              for n in "${NEWER[@]}"; do echo "- $n"; done
            } | gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file -
            exit 0
          fi

          # --- Ensure the `dependencies` label exists --------------------------
          # The repo doesn't ship a `dependencies` label by default; create it
          # idempotently (no-op / non-fatal if it already exists).
          gh label create dependencies \
            --repo "$GITHUB_REPOSITORY" \
            --color 0366d6 \
            --description "Dependency bumps and upstream version tracking" \
            2>/dev/null || true

          # --- File the issue --------------------------------------------------
          BODY_FILE="$(mktemp)"
          {
            echo "$MARKER"
            echo
            echo "**VoxSherpa-TTS** needs attention: a fork release is ahead of the pin in"
            echo "\`core-playback/build.gradle.kts\`, and/or upstream changed engine sources"
            echo "since the last fork-side review. Dependabot can't see this because the"
            echo "dependency is resolved through JitPack as a raw GitHub coordinate"
            echo "(\`com.github.techempower-org:VoxSherpa-TTS:vX.Y.Z\`), so this scheduled"
            echo "watch tracks it instead."
            echo
            echo "**Currently pinned:** \`$PINNED\`"
            echo
            echo "**Findings:**"
            for n in "${NEWER[@]}"; do echo "- $n"; done
            echo
            echo "### To bump"
            echo "1. Upstream engine changes: review the compare link, port what's wanted"
            echo "   into the fork \`$FORK_REPO\` and tag a fork release (JitPack builds the"
            echo "   fork coordinate, not upstream). Then advance \`UPSTREAM_REVIEWED_SHA\`"
            echo "   in \`.github/workflows/voxsherpa-watch.yml\` to the reviewed upstream sha."
            echo "2. Update the pin in \`core-playback/build.gradle.kts\`:"
            echo "   \`implementation(\"com.github.techempower-org:VoxSherpa-TTS:<new>\")\`"
            echo "3. Build \`:core-playback:assembleDebug\` + \`:app:assembleDebug\`, then do an"
            echo "   on-device TTS smoke test (synthesize a Kokoro/Kitten voice) — VoxSherpa"
            echo "   wraps native sherpa-onnx, so runtime JNI behaviour matters beyond compile."
            echo
            echo "_Filed automatically by \`.github/workflows/voxsherpa-watch.yml\`._"
          } > "$BODY_FILE"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "VoxSherpa-TTS: fork release or upstream engine changes ahead of $PINNED" \
            --label dependencies \
            --body-file "$BODY_FILE"

          echo "Filed VoxSherpa watch issue."
